<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クリプト・パーティー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F4F8FB;--panel:#FFFFFF;--soft:#EEF5FA;--line:#DCE7F0;--text:#14213D;--muted:#5B6B7F;--accent:#2B9BEA;--accent-2:#7CC6F5;--accent-soft:#E6F3FD;--accent-ink:#0B4F82;--ok:#14A37F;--ok-soft:#E3F6F0;--warn:#D98200;--warn-soft:#FFF3E0;--red:#E5484D;--red-soft:#FDECEC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.num{font-family:"Space Grotesk","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
[hidden]{display:none!important}
button{font-family:inherit}
header{position:sticky;top:0;z-index:15;background:rgba(244,248,251,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:6px;padding:10px 12px;max-width:560px;margin:0 auto}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center;flex:none;line-height:1}
.ib:disabled{opacity:.35;cursor:default}
.logo{font-size:14px;font-weight:900;margin:0 0 0 4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.logo span{color:var(--accent)}
.bal{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;border:0}
.bal.up{animation:up .5s}
.bal.down{animation:dn .5s}
@keyframes up{30%{background:var(--ok-soft);color:var(--ok)}}
@keyframes dn{30%{background:var(--warn-soft);color:var(--warn)}}
main{max-width:560px;margin:0 auto;padding:14px 16px 110px}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:700;letter-spacing:.04em}
.btn{border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:900;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--accent);color:#fff}
.btn-sub{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn-small{padding:9px 12px;font-size:14px;font-weight:700;width:auto}
h2{margin:4px 0 0;font-size:24px}
p{margin:0;line-height:1.7}
.muted{color:var(--muted)}
.small{font-size:12.5px;color:var(--muted)}
.center{text-align:center}
.err{font-size:13px;color:var(--red)}
.term{border-bottom:1.5px dotted var(--accent);color:inherit;cursor:help;font-weight:inherit}
.term:hover{background:var(--accent-soft)}

/* home */
.hero{padding:40px 4px 8px;display:grid;gap:12px}
.hero h1{font-size:40px;font-weight:900;margin:0;line-height:1.15}
.hero h1 span{color:var(--accent)}
.hero .tag{font-size:15px;font-weight:700;color:var(--accent-ink)}
.ills{display:flex;gap:10px;margin:14px 0 6px}
.ills i{width:56px;height:56px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:24px}

/* login */
.lang{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.lang button{flex:1;border:0;border-radius:9px;padding:9px;font-size:14px;font-weight:700;color:var(--muted);background:transparent;cursor:pointer}
.lang button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(20,33,61,.12)}
.g{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #ddd;display:grid;place-items:center;font-size:13px;font-weight:900;color:#4285F4;font-family:Arial,sans-serif}
.divider{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}

/* sheets / overlay / drawer */
.scrim{position:fixed;inset:0;background:rgba(20,33,61,.38);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px 26px;display:grid;gap:12px;animation:sup .22s ease-out;max-height:82vh;overflow:auto}
@keyframes sup{from{transform:translateY(40px);opacity:.5}}
.sheet-hd{display:flex;align-items:center;gap:8px}
.sheet-hd b{flex:1;font-size:17px}
.acct{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;width:100%;color:var(--text);font-size:15px}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.drawer-scrim{position:fixed;inset:0;background:rgba(20,33,61,.38);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(320px,86vw);height:100%;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:6px;animation:sl .22s ease-out;overflow:auto}
@keyframes sl{from{transform:translateX(30px);opacity:.5}}
.drawer .who{display:flex;align-items:center;gap:10px;padding:8px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;font-size:15px;color:var(--text);text-align:left;width:100%}
.mi:hover{background:var(--soft)}
.mi .ic{width:26px;text-align:center;font-size:18px}
.mi:disabled{opacity:.4;cursor:default}
.overlay{position:fixed;inset:0;background:rgba(244,248,251,.94);display:flex;align-items:center;justify-content:center;z-index:25;text-align:center}
.overlay .o-big{font-size:120px;font-weight:700;color:var(--accent);margin:0}

/* prep */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.steps li{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px}
.steps li .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;margin-top:2px}
.steps li.done{color:var(--text)}
.steps li.done .d{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:900}
.steps li.doing .d{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps code{display:block;font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* select */
.games{display:grid;gap:12px}
.game-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text);text-align:left;width:100%}
.game-card .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--accent-soft)}
.game-card b{font-size:18px;display:block}
.game-card span{font-size:13px;color:var(--muted)}
.game-card .go{margin-left:auto;color:var(--muted);font-size:22px}
.entry{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px}
.rules{margin:0;padding-left:22px;line-height:1.9;font-size:16px}

/* game */
.ai{background:var(--accent-soft);border-color:#CBE5F8}
.ai-line{font-size:15.5px;line-height:1.6;min-height:50px}
.ai-tag{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:8px;vertical-align:1px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px 14px}
.potbar{display:flex;gap:8px;width:100%}
.potbar div{flex:1;background:var(--soft);border-radius:12px;padding:8px}
.potbar b{display:block;font-size:17px}
.potbar span{font-size:11.5px;color:var(--muted)}
.timer{font-size:80px;font-weight:700;line-height:1;margin:0}
.timer.low{color:var(--red)}
.lastline{font-size:16px;min-height:26px}
.lastline b{color:var(--accent-ink)}
.push{width:184px;height:184px;border-radius:50%;border:8px solid #CFE8FA;background:var(--accent);color:#fff;font-size:32px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(43,155,234,.28);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.push small{display:block;font-size:14px;font-weight:700;opacity:.9}
.push:active{transform:scale(.95)}
.push:disabled{background:#A9C4D8;box-shadow:none}
.push.red{background:var(--red);border-color:#F9CFD0;box-shadow:0 10px 30px rgba(229,72,77,.25)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%}
.board li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px;border:1px solid transparent;text-align:left}
.board li.lead{border-color:var(--accent);background:var(--accent-soft)}
.board .tagme{color:var(--muted);font-size:12px;margin-left:6px}
.board .crown{color:var(--accent);font-size:11px;margin-left:6px}
.board .c{color:var(--muted);font-size:13px}
.rope{width:100%;height:56px;position:relative;margin:6px 0}
.rope .line{position:absolute;left:0;right:0;top:26px;height:5px;background:#C8A66B;border-radius:3px}
.rope .mid{position:absolute;left:50%;top:6px;width:2px;height:44px;background:var(--muted);opacity:.4}
.rope .flag{position:absolute;top:10px;width:16px;height:36px;margin-left:-8px;background:var(--warn);border-radius:4px;transition:left .15s ease-out}
.teams{display:flex;justify-content:space-between;width:100%;font-size:14px}
.teams b{font-size:26px;display:block}
.teams .a b{color:var(--accent)}
.teams .b b{color:var(--red)}
.track{width:100%;display:grid;gap:8px}
.lane{display:grid;grid-template-columns:68px 1fr;gap:8px;align-items:center;font-size:13px;text-align:left}
.lane span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden;position:relative}
.lane .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-2);border-radius:7px;transition:width .12s}
.lane.me .bar i{background:var(--accent)}
.oni{font-size:23px;font-weight:900;min-height:40px}
.oni.red{color:var(--red)}
.oni.green{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px}
.stat .v{font-size:21px;font-weight:700;margin:0}
.stat .k{font-size:11.5px;color:var(--muted);margin:0}
.tip{font-size:13px;line-height:1.6;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.feed{list-style:none;margin:0;padding:0;font-size:12px;display:grid;gap:5px}
.feed li{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 9px;border-radius:8px;background:var(--soft)}
.feed li>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .sig{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{color:var(--ok);font-weight:700}
.pend{color:var(--warn);font-weight:700}
.ng{color:var(--red);font-weight:700}

/* learn / wallet */
.result{font-size:24px;font-weight:900;text-align:center;margin-top:2px}
.reveal{text-align:center;padding:20px 16px}
.reveal .big{font-size:60px;font-weight:700;color:var(--accent);line-height:1;margin:6px 0}
.pl{display:grid;gap:8px}
.pl-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.pl-total b{font-size:24px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:9px 11px;font-size:13.5px}
.row .ic{font-size:16px;width:20px;text-align:center}
.row .sig{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus{color:var(--ok);font-weight:700}
.minus{color:var(--warn);font-weight:700}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;cursor:pointer;color:var(--text);display:grid;gap:6px;min-height:92px}
.topic .ic{font-size:22px}
.topic b{font-size:14.5px;line-height:1.4}
.topic.on{border-color:var(--accent);background:var(--accent-soft)}
.detail{display:grid;gap:12px}
.detail-hd{display:flex;align-items:center;gap:6px}
.detail-hd h4{margin:0;font-size:18px;flex:1}
.rows{display:grid;gap:6px}
.quiz{border:1px dashed #B9D9F2;border-radius:14px;padding:12px;display:grid;gap:10px}
.quiz .q{font-weight:700;font-size:15px}
.quiz .btns{display:flex;gap:8px}
.quiz .hint{background:var(--warn-soft);border-radius:10px;padding:10px;font-size:14px;line-height:1.7}
.quiz .ans{background:var(--ok-soft);border-radius:10px;padding:10px;font-size:14px;line-height:1.7}
.list{margin:0;padding-left:20px;line-height:1.9;font-size:14px}
.connect ol{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
.warnbox{border:1px solid #F5B5B7;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7;background:var(--red-soft)}
.secret{background:var(--soft);border-radius:10px;padding:10px;font-size:12px;word-break:break-all}
.balbig{font-size:44px;font-weight:700;margin:2px 0}
.spark{width:100%;height:90px;display:block}
.gamebox{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px}
.gamebox .hd2{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.gamebox .r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
a{color:var(--accent-ink)}

/* glossary */
.search{position:relative}
.gl{display:grid;gap:8px}
.gl button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--text)}
.gl b{font-size:15px}
.gl span{font-size:13px;color:var(--muted)}
.termbody{font-size:15px;line-height:1.8}
.termshort{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-weight:700;color:var(--accent-ink)}
.pager{display:flex;justify-content:space-between;gap:8px}

/* glossary learning */
.pbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;cursor:pointer;color:var(--text);display:grid;gap:8px}
.cat .ic{font-size:24px}
.cat b{font-size:15px}
.cat .small{display:flex;justify-content:space-between}
.gl button.done b::after{content:" ✓";color:var(--ok)}
.flash{border:1px solid var(--line);background:var(--panel);border-radius:20px;min-height:220px;display:grid;place-items:center;text-align:center;padding:22px;cursor:pointer}
.flash .ft{font-size:28px;font-weight:900}
.flash .fs{font-size:16px;font-weight:700;color:var(--accent-ink);margin-top:10px}
.flash .fb{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.7}
.row2{display:flex;gap:8px}
.linkcard{display:flex;align-items:center;gap:10px;border:1px dashed #A9D3F2;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:13px 14px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;text-align:left}
.linkcard span{flex:1}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips button{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--text);cursor:pointer}
.tchips button.done{border-color:var(--ok);background:var(--ok-soft)}
.catlabel{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.learnbtn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
/* phantom guide */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px;font-size:14px;font-weight:700;color:var(--muted);background:transparent;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(20,33,61,.12)}
.mock{width:220px;margin:0 auto;border:8px solid #1d2433;border-radius:30px;background:#13161f;color:#e9ecf3;padding:14px 12px 18px;min-height:260px;display:flex;flex-direction:column;gap:9px}
.mock .mh{font-size:12px;color:#9aa3b5;text-align:center;margin-bottom:6px}
.mock .mi2{border:1px solid #2b3244;border-radius:12px;padding:10px;font-size:12.5px;text-align:center;background:#1b2030;position:relative}
.mock .mi2.hl{border:2px solid #7CC6F5;background:#1e3248;font-weight:700}
.mock .mi2.hl::after{content:attr(data-tap);position:absolute;right:-8px;top:-12px;background:#2B9BEA;color:#fff;font-size:10.5px;border-radius:999px;padding:1px 7px}
.stepno{font-size:13px;color:var(--accent-ink);font-weight:700}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
/* qr */
.qrbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;place-items:center;min-height:240px}
.qrbox img,.qrbox canvas{width:min(260px,70vw)!important;height:auto!important;image-rendering:pixelated}
/* AI assistant */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:18px;width:64px;height:58px;border:0;background:transparent;cursor:pointer;z-index:20;padding:0;filter:drop-shadow(0 6px 14px rgba(43,155,234,.4))}
.fab .hex{width:100%;height:100%;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:linear-gradient(135deg,#2B9BEA,#5FC4F0);display:grid;place-items:center;color:#fff}
.fab svg{width:30px;height:30px}
.fab .x{display:none;font-size:26px;line-height:1}
.fab.open .net{display:none}
.fab.open .x{display:block}
.fab-label{position:fixed;right:max(84px,calc(50% - 196px));bottom:34px;background:var(--text);color:#fff;font-size:12px;border-radius:8px;padding:5px 9px;z-index:20;white-space:nowrap}
.chat{position:fixed;right:max(12px,calc(50% - 268px));bottom:90px;width:min(360px,calc(100vw - 24px));height:min(480px,66vh);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(20,33,61,.18);z-index:21;display:flex;flex-direction:column;overflow:hidden;animation:sup .2s ease-out}
.chat-hd{display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.chat-hd b{flex:1;font-size:15px}
.chat-hd .ib{width:30px;height:30px;font-size:15px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{font-size:13.5px;line-height:1.7;padding:9px 12px;border-radius:14px;max-width:88%}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.a{align-self:flex-start;background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}

let lang = store.get("cp_lang") || "ja";
const raw = (k) => { const s = D[lang][k]; return s === undefined ? D.ja[k] : s; };
const fill = (s, v = {}) => s.replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const rich = s => s.replace(/\[\[(\w+)\|([^\]]+)\]\]/g, (_, k, w) => `<button class="term" data-term="${k}" type="button" style="background:none;border:0;border-bottom:1.5px dotted var(--accent);padding:0;font:inherit;color:inherit">${w}</button>`);
const plain = s => s.replace(/\[\[(\w+)\|([^\]]+)\]\]/g, "$2");
const t = (k, v) => { const s = raw(k); return typeof s === "string" ? rich(fill(s, v)) : s; };
const tp = (k, v) => plain(fill(raw(k), v));

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  $("nickIn").placeholder = tp("nick_ph"); $("glSearch").placeholder = tp("gl_ph"); $("chatIn").placeholder = tp("chat_ph");
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("backBtn").setAttribute("aria-label", lang === "ja" ? "戻る" : "Back"); $("fwdBtn").setAttribute("aria-label", lang === "ja" ? "進む" : "Forward");
  $("qrHow").innerHTML = raw("qr_how").map(s => `<li>${esc(s)}</li>`).join("");
  $("chips").innerHTML = raw("chips").map((c, i) => `<button type="button" data-chip="${i}">${c}</button>`).join("");
  renderGloss(); updateBal(); refreshCurrent();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("cp_lang", lang); applyLang(); });

// ================= 画面・戻る・進む =================
const SCREENS = ["scrHome","scrLogin","scrPrep","scrSelect","scrRules","scrGame","scrLearn","scrWallet","scrGloss","scrCat","scrPhantom","scrQR"];
const NO_REVISIT = ["scrPrep", "scrGame"];
let stack = ["scrHome"], fwd = [];
const cur = () => stack[stack.length - 1];
function render(id) {
  SCREENS.forEach(s => $(s).hidden = s !== id);
  $("backBtn").disabled = stack.length <= 1 || id === "scrPrep";
  $("fwdBtn").disabled = !fwd.length || id === "scrGame" || id === "scrPrep";
  const showFab = loggedIn && id !== "scrGame" && id !== "scrPrep";
  $("fab").hidden = !showFab; $("fabLabel").hidden = !showFab || chatOpen || chatHinted;
  if (!showFab) closeChat();
  window.scrollTo(0, 0);
  onShow(id);
}
function go(id, replace) { fwd = []; if (replace) stack[stack.length - 1] = id; else if (cur() !== id) stack.push(id); render(id); }
$("backBtn").onclick = () => {
  if (stack.length <= 1) return;
  if (cur() === "scrGame") stopGame();
  const leaving = stack.pop(); if (!NO_REVISIT.includes(leaving)) fwd.push(leaving);
  while (stack.length > 1 && NO_REVISIT.includes(cur())) stack.pop();
  render(cur());
};
$("fwdBtn").onclick = () => { if (!fwd.length) return; const id = fwd.pop(); if (cur() === "scrGame") stopGame(); stack.push(id); render(id); };
function onShow(id) {
  if (id === "scrWallet") renderWallet();
  if (id === "scrLearn") renderLearn();
  if (id === "scrGloss") renderGloss();
  if (id === "scrCat") renderCat();
  if (id === "scrPhantom") renderPg();
  if (id === "scrQR") initQR();
}
function refreshCurrent() { const id = cur(); if (["scrWallet", "scrLearn", "scrGloss", "scrCat", "scrPhantom", "scrQR"].includes(id)) onShow(id); if (id === "scrRules") fillRules(); }

// ================= メニュー =================
$("menuBtn").onclick = () => { $("drawerWho").innerHTML = loggedIn ? `<span class="av">${esc(me.name.slice(0, 1))}</span><div><b>${esc(me.name)}</b><br><span class="small num">${solp(bal)} SOL</span></div>` : `<span class="small">${tp("browser_note")}</span>`;
  document.querySelectorAll(".mi").forEach(b => { const m = b.dataset.m; b.disabled = (!loggedIn && !["gloss", "qr", "phantom"].includes(m)) || (m === "learn" && !lastGame); });
  $("drawerScrim").hidden = false; };
const closeDrawer = () => { $("drawerScrim").hidden = true; };
$("drawerClose").onclick = closeDrawer;
$("drawerScrim").onclick = e => { if (e.target === $("drawerScrim")) closeDrawer(); };
document.querySelectorAll(".mi").forEach(b => b.onclick = () => {
  const m = b.dataset.m; closeDrawer();
  if (cur() === "scrGame" && m !== "ai") stopGame();
  if (m === "select") go("scrSelect"); else if (m === "learn") go("scrLearn"); else if (m === "wallet") go("scrWallet"); else if (m === "gloss") go("scrGloss");
  else if (m === "phantom") go("scrPhantom"); else if (m === "qr") go("scrQR");
  else if (m === "ai") openChat(); else if (m === "reset") resetAll();
});
$("balChip").onclick = () => { if (cur() !== "scrGame") go("scrWallet"); };

// ================= 用語シート・用語集 =================
let learned = new Set(); try { learned = new Set(JSON.parse(store.get("cp_learned") || "[]")); } catch (e) {}
const saveLearned = () => store.set("cp_learned", JSON.stringify([...learned]));
const catName = c => lang === "ja" ? c.ja : c.en;
let termKey = TERM_KEYS[0];
document.addEventListener("click", e => { const b = e.target.closest(".term,[data-tk]"); if (!b) return; e.preventDefault(); openTerm(b.dataset.term || b.dataset.tk); });
function openTerm(k) { termKey = TERMS.ja[k] ? k : TERM_KEYS[0]; showTerm(); $("termScrim").hidden = false; }
function showTerm() {
  const [ti, sh, bo] = TERMS[lang][termKey]; const c = catOf(termKey);
  $("termCat").textContent = c.icon + " " + catName(c); $("termTitle").textContent = ti; $("termShort").textContent = sh; $("termBody").textContent = bo;

// ================= ウォレット =================
const ALPH = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58enc(bytes){let d=[0];for(const b of bytes){let c=b;for(let i=0;i<d.length;i++){c+=d[i]<<8;d[i]=c%58;c=(c/58)|0}while(c){d.push(c%58);c=(c/58)|0}}let o="";for(const b of bytes){if(b===0)o+="1";else break}for(let i=d.length-1;i>=0;i--)o+=ALPH[d[i]];return o}
function b58dec(s){const by=[0];for(const ch of s){const v=ALPH.indexOf(ch);if(v<0)throw 0;let c=v;for(let i=0;i<by.length;i++){c+=by[i]*58;by[i]=c&255;c>>=8}while(c){by.push(c&255);c>>=8}}for(const ch of s){if(ch==="1")by.push(0);else break}return new Uint8Array(by.reverse())}
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const wallet = { address: "", secret: "", key: null, real: false };
async function initWallet() {
  try {
    const saved = store.get("cp_burner"); let pk8, pub;
    if (saved) { const o = JSON.parse(saved); pk8 = b58dec(o.pk8); pub = b58dec(o.pub); wallet.key = await crypto.subtle.importKey("pkcs8", pk8, { name: "Ed25519" }, false, ["sign"]); }
    else { const kp = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]); pub = new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey)); pk8 = new Uint8Array(await crypto.subtle.exportKey("pkcs8", kp.privateKey)); wallet.key = kp.privateKey; store.set("cp_burner", JSON.stringify({ pk8: b58enc(pk8), pub: b58enc(pub) })); }
    const sec = new Uint8Array(64); sec.set(pk8.slice(pk8.length - 32), 0); sec.set(pub, 32);
    wallet.address = b58enc(pub); wallet.secret = b58enc(sec); wallet.real = true;
  } catch (e) { wallet.address = b58enc(rand(32)); wallet.real = false; }
}
async function sign(text) { if (wallet.real) { try { return b58enc(new Uint8Array(await crypto.subtle.sign({ name: "Ed25519" }, wallet.key, new TextEncoder().encode(text)))); } catch (e) {} } return b58enc(rand(64)); }

  $("rulesAi").textContent = tp("ai_rules_" + gameId);
  $("rulesTerms").innerHTML = chipsHtml(GAME_TERMS[gameId]);
}
$("rulesStart").onclick = () => startGame();

let aiQ = [], aiBusy = false, aiTimer = null, lastAiAt = 0;
function ai(text, urgent) { if (urgent) { aiQ = [text]; if (aiTimer) { clearInterval(aiTimer); aiTimer = null; aiBusy = false; } } else if (aiQ.length < 2) aiQ.push(text); if (!aiBusy) aiNext(); }
function aiNext() {
  if (!aiQ.length) { aiBusy = false; return; }
  aiBusy = true; const text = aiQ.shift(); lastAiAt = performance.now();
  const el = $("aiLine"); el.innerHTML = '<span class="ai-tag">AI</span>'; const sp = document.createElement("span"); el.appendChild(sp);
  let i = 0; aiTimer = setInterval(() => { sp.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(aiTimer); aiTimer = null; setTimeout(aiNext, 900); } }, 24);
}
const A = (k, v) => fill(pick(D[lang].ai[gameId][k]), v || {});
function aiMaybe(text, gap = 3500) { if (performance.now() - lastAiAt > gap) ai(text); }

function sendTx(p, ix, status) {
  const ms = Math.round(110 + Math.random() * 110);
  const item = { name: p.name, ix, sig: "", st: tp("confirming"), cls: "pend" };
  feed.unshift(item); if (feed.length > 30) feed.pop();
  txAll++;
  if (p.isMe) { G.myCount++; bal -= FEE; G.myFee += FEE; updateBalQuiet(); }
  (p.isMe ? sign(`${gameId}:${ix}:${me.name}:${G.myCount}:${Date.now()}`) : Promise.resolve(b58enc(rand(64)))).then(sig => { item.sig = sig; feedDirty = true; if (p.isMe) myTx.unshift({ ix, sig, ms, game: gameId }); });
  feedDirty = true;
  setTimeout(() => { times.push(ms); if (times.length > 400) times.shift(); if (status === "ng") { item.st = "✕ " + tp("reset_ix"); item.cls = "ng"; } else { item.st = "✓ " + ms + "ms"; item.cls = "ok"; } feedDirty = true; }, ms);
  return ms;
}
function updateBalQuiet() { $("balChip").textContent = "◎ " + solp(bal) + " SOL"; const f = $("gFee"); if (f) f.textContent = G.myFee.toFixed(6); }
function renderFeed() {
  if (!feedDirty) return; feedDirty = false;
  const ul = $("feed"); ul.innerHTML = "";
  feed.slice(0, 6).forEach(f => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = f.name;
    const b = document.createElement("span"); b.className = "sig mono"; b.textContent = f.sig ? `${f.ix} · ${f.sig}` : f.ix;
    const c = document.createElement("span"); c.className = f.cls; c.textContent = f.st;
    li.append(a, b, c); ul.appendChild(li);
  });
  $("sMine").textContent = G ? G.myCount : 0; $("sTotal").textContent = txAll; $("sMed").textContent = times.length ? median(times) + "ms" : "–";
}
function rotateTip() { const tips = raw("tips"); $("tip").innerHTML = "ⓘ " + rich(tips[tipI++ % tips.length]); }
const potBar = () => `<div class="potbar"><div><b class="num">${(ENTRY * 4).toFixed(2)} SOL</b><span>${tp("pot_l")}</span></div><div><b class="num" id="gFee">0.000000</b><span>${tp("myfee_l")} (SOL)</span></div></div>`;

async function startGame() {
  stopGame();
  feed = []; feedDirty = true; G = { id: gameId, myCount: 0, myFee: 0, over: false, players: [] };
  G.players = [{ name: me.name, isMe: true }, ...BOT_NAMES.map(n => ({ name: n, isMe: false }))];
  go("scrGame");
  $("aiLine").innerHTML = '<span class="ai-tag">AI</span>';
  rotateTip(); renderFeed();
  ({ last: setupLast, tug: setupTug, daruma: setupDaruma })[gameId]();
  $("overlay").hidden = false; $("oSmall").textContent = tp("host_start");
  addLedger("entry", -ENTRY, { game: gameId });
  for (const n of [3, 2, 1]) { $("oBig").textContent = n; await sleep(650); if (!G || G.over) { $("overlay").hidden = true; return; } }
  $("overlay").hidden = true;
  G.startAt = performance.now();
  ai(A("start"), true);
  G.tipH = setInterval(rotateTip, 6000);
  G.tickH = setInterval(() => { G.tick(); renderFeed(); }, 80);
}
function stopGame() {
  if (!G || G.over) return;
  G.over = true; clearInterval(G.tickH); clearInterval(G.tipH); $("overlay").hidden = true;
  settleMoney(0, tp("no_win"), true);
}
function settleMoney(prize, resultText, aborted) {
  // 手数料は押すたびに引いているので、台帳にはまとめて1行で残す
  bal += G.myFee; addLedger("fee", -G.myFee, { game: gameId, n: G.myCount });
  if (prize > 0) addLedger("prize", prize, { game: gameId });
  const net = -ENTRY - G.myFee + prize;
  if (!aborted || G.myCount > 0) gameLog.push({ id: gameId, result: resultText, taps: G.myCount, prize, net });
  if (aborted) return;
  lastGame = { id: gameId, result: resultText, mine: G.myCount, total: txAll, med: median(times), taps: G.myCount, fee: G.myFee, prize, net };
}
async function finish(resultText, prize) {
  if (G.over) return; G.over = true; clearInterval(G.tickH); clearInterval(G.tipH);
  renderFeed();
  settleMoney(prize, resultText, false);
  await sleep(1700);
  if (cur() !== "scrGame") return;
  go("scrLearn", true);
}

// ---------------- ラストワン ----------------
function setupLast() {
  const P = G.players; P.forEach(p => { p.left = 10; p.presses = 0; p.lastAt = 0; p.aggro = p.isMe ? 0 : 0.8 + Math.random() * 0.7; });
  G.last = null; G.deadline = 0; G.hardEnd = 0; G.warned = false;
  $("stage").innerHTML = potBar() + `<p class="timer num" id="lTimer">10.0</p><p class="lastline" id="lLast">${tp("nobody")}</p><button class="push" id="lPush">${tp("tap")}<small id="lLeft">${tp("left", { n: 10 })}</small></button><ul class="board" id="lBoard"></ul>`;
  const board = () => { $("lBoard").innerHTML = [...P].sort((a, b) => b.presses - a.presses).map(p => `<li class="${p === G.last ? "lead" : ""}"><span><b>${esc(p.name)}</b>${p.isMe ? `<span class="tagme">（${tp("you")}）</span>` : ""}${p === G.last ? `<span class="crown">●</span>` : ""}</span><span class="c">${p.presses}${tp("times")} · ${tp("left", { n: p.left })}</span></li>`).join(""); };
  const press = p => {
    if (G.over || !G.startAt || p.left < 1) return;
    const now = performance.now(); if (now - p.lastAt < 300) return; p.lastAt = now;
    const first = p.presses === 0, changed = G.last !== p;
    p.left--; p.presses++; G.last = p; G.deadline = Math.min(now + 10000, G.hardEnd); G.warned = false;
    const ms = sendTx(p, `press #${p.presses}`);
    $("lLast").innerHTML = `${tp("last_label")}<b></b>`; $("lLast").querySelector("b").textContent = p.name;
    if (p.isMe) { $("lLeft").textContent = tp("left", { n: p.left }); if (p.left < 1) $("lPush").disabled = true; }
    if (first && p.isMe) ai(A("first", { name: p.name }));
    else if (changed) aiMaybe(A("change", { name: p.name }), 2500);
    if (p.isMe && G.myCount % 3 === 0) ai(A("explain", { ms, total: txAll }));
    board();
  };
  board();
  $("lPush").onclick = () => press(P[0]);
  G.tick = () => {
    if (!G.startAt) return;
    const now = performance.now();
    if (!G.deadline) { G.deadline = G.startAt + 10000; G.hardEnd = G.startAt + 90000; }
    const left = Math.max(0, G.deadline - now) / 1000;
    $("lTimer").textContent = left.toFixed(1); $("lTimer").classList.toggle("low", left < 3);
    if (left < 3 && left > 0 && !G.warned && G.last) { G.warned = true; ai(A("low")); }
    const el = (now - G.startAt) / 1000, fatigue = Math.max(0.15, 1 - el / 70);
    P.slice(1).forEach(b => { let pr = 0; if (left < 1.3) pr = 0.11; else if (left < 2.6) pr = 0.04; else if (left < 5) pr = 0.008; if (b !== G.last && Math.random() < pr * b.aggro * fatigue) press(b); });
    if (left <= 0) { const w = G.last; ai(fill(D[lang].ai.last.end, { name: w ? w.name : "—" }), true); finish(w ? (w.isMe ? tp("win_me") : tp("win_other", { name: w.name })) : tp("no_win"), w && w.isMe ? ENTRY * 4 : 0); }
  };
}

// ---------------- 綱引き ----------------
function setupTug() {
  const P = G.players; P[0].team = "a"; P[1].team = "a"; P[2].team = "b"; P[3].team = "b";
  P.forEach(p => { p.presses = 0; p.lastAt = 0; p.next = 0; });
  G.a = 0; G.b = 0; G.dur = 20000; G.leadSaid = "";
  $("stage").innerHTML = potBar() + `<p class="timer num" id="tTimer">20.0</p><div class="teams"><div class="a"><b class="num" id="tA">0</b>${tp("team_a")}<br><span class="small">${esc(P[0].name)} · ${P[1].name}</span></div><div class="b" style="text-align:right"><b class="num" id="tB">0</b>${tp("team_b")}<br><span class="small">${P[2].name} · ${P[3].name}</span></div></div><div class="rope"><div class="line"></div><div class="mid"></div><div class="flag" id="tFlag" style="left:50%"></div></div><button class="push" id="tPush">${tp("pull")}</button>`;
  const press = p => {
    if (G.over || !G.startAt) return;
    const now = performance.now(); if (now - p.lastAt < 110) return; p.lastAt = now;
    p.presses++; if (p.team === "a") G.a++; else G.b++;
    const ms = sendTx(p, `pull #${p.presses}`);
    if (p.isMe && G.myCount % 12 === 0) ai(A("explain", { ms, total: txAll }));
  };
  $("tPush").onclick = () => press(P[0]);
  G.tick = () => {
    if (!G.startAt) return;
    const now = performance.now(), el = now - G.startAt, left = Math.max(0, G.dur - el) / 1000;
    P.slice(1).forEach(b => { if (now >= b.next) { press(b); b.next = now + (b.team === "a" ? 230 : 205) + Math.random() * 230; } });
    $("tTimer").textContent = left.toFixed(1); $("tTimer").classList.toggle("low", left < 3);
    $("tA").textContent = G.a; $("tB").textContent = G.b;
    const diff = G.a - G.b; $("tFlag").style.left = Math.max(6, Math.min(94, 50 - diff * 1.2)) + "%";
    const lead = diff > 2 ? "a" : diff < -2 ? "b" : "";
    if (lead && lead !== G.leadSaid) { G.leadSaid = lead; aiMaybe(A("lead", { team: tp(lead === "a" ? "team_a" : "team_b") }), 2500); }
    if (left <= 0) { const w = G.a >= G.b ? "a" : "b"; ai(fill(D[lang].ai.tug.end, { team: tp(w === "a" ? "team_a" : "team_b"), total: txAll }), true); finish(w === "a" ? tp("win_team_a") : tp("win_team_b"), w === "a" ? ENTRY * 2 : 0); }
  };
}

// ---------------- だるまさんが転んだ ----------------
function setupDaruma() {
  const P = G.players; P.forEach(p => { p.pos = 0; p.presses = 0; p.lastAt = 0; p.next = 0; p.speed = p.isMe ? 0 : 230 + Math.random() * 120; p.care = 0.6 + Math.random() * 0.35; });
  G.light = "wait"; G.lightUntil = 0;
  $("stage").innerHTML = potBar() + `<div class="oni" id="dOni">…</div><div class="track" id="dTrack"></div><button class="push" id="dPush">${tp("run")}</button>`;
  const lanes = () => { $("dTrack").innerHTML = P.map(p => `<div class="lane ${p.isMe ? "me" : ""}"><span>${esc(p.name)}</span><div class="bar"><i style="width:${p.pos}%"></i></div></div>`).join(""); };
  lanes();
  const press = p => {
    if (G.over || !G.startAt || G.light === "wait") return;
    const now = performance.now(); if (now - p.lastAt < 120) return; p.lastAt = now;
    p.presses++;
    if (G.light === "red") { p.pos = 0; sendTx(p, `step #${p.presses}`, "ng"); ai(A("caught", { name: p.name }), true); }
    else {
      p.pos = Math.min(100, p.pos + 4);
      const ms = sendTx(p, `step #${p.presses}`);
      if (p.isMe && G.myCount % 10 === 0) ai(A("explain", { ms }));
      const top = [...P].sort((a, b) => b.pos - a.pos)[0];
      if (top.pos > 60 && top !== G.topSaid) { G.topSaid = top; aiMaybe(A("lead", { name: top.name }), 3000); }
      if (p.pos >= 100) { ai(fill(D[lang].ai.daruma.end, { name: p.name }), true); finish(p.isMe ? tp("win_me") : tp("win_other", { name: p.name }), p.isMe ? ENTRY * 4 : 0); }
    }
    lanes();
  };
  $("dPush").onclick = () => press(P[0]);
  const setLight = (l, dur) => {
    G.light = l; G.lightUntil = performance.now() + dur; G.lightAt = performance.now();
    const o = $("dOni"); o.className = "oni " + (l === "red" ? "red" : "green"); o.textContent = l === "red" ? tp("d_red") : tp("d_green");
    $("dPush").classList.toggle("red", l === "red"); $("dPush").textContent = l === "red" ? tp("stop") : tp("run");
  };
  G.tick = () => {
    if (!G.startAt) return;
    const now = performance.now();
    if (G.light === "wait") setLight("green", 1800 + Math.random() * 1800);
    else if (now >= G.lightUntil) { if (G.light === "green") setLight("red", 1500 + Math.random() * 600); else setLight("green", 1600 + Math.random() * 2200); }
    P.slice(1).forEach(b => {
      if (now < b.next) return; b.next = now + b.speed + Math.random() * 140;
      if (G.light === "green") { if (G.lightUntil - now > 220 || Math.random() > b.care) press(b); }
      else if (now - G.lightAt < 260 && Math.random() > b.care + 0.25) press(b);
    });
    if (now - G.startAt > 75000 && !G.over) { const top = [...P].sort((a, b) => b.pos - a.pos)[0]; ai(fill(D[lang].ai.daruma.end, { name: top.name }), true); finish(top.isMe ? tp("win_me") : tp("win_other", { name: top.name }), top.isMe ? ENTRY * 4 : 0); }
  };
}

// ================= 振り返り =================
let topic = null; const opened = {}; const TOPICS = ["t1", "t2", "t3", "t4"];
function renderLearn() {
  const s = lastGame; if (!s) return;
  $("resultLine").textContent = s.result;
  $("plRows").innerHTML = `<div class="row"><span class="ic">🎟️</span><span>${t("pl_entry")}</span><span class="minus num">−${ENTRY.toFixed(4)}</span></div>
    <div class="row"><span class="ic">⚡</span><span>${t("pl_fee", { n: s.taps })}</span><span class="minus num">−${s.fee.toFixed(6)}</span></div>
    <div class="row"><span class="ic">🏆</span><span>${t("pl_prize")}</span><span class="${s.prize > 0 ? "plus" : "muted"} num">+${s.prize.toFixed(4)}</span></div>
    <div class="pl-total"><span style="font-weight:700">${t("pl_total")}</span><b class="num ${s.net >= 0 ? "plus" : "minus"}">${sol(s.net, 6)} SOL</b></div>`;
  $("bigN").textContent = s.mine;
  $("bigSub").textContent = tp("big_sub", { total: s.total, med: s.med });
  $("learnTerms").innerHTML = chipsHtml([...new Set([...GAME_TERMS[s.id], ...TODAY_TERMS])]);
  const items = { t1: "🧾", t2: "👛", t3: "⚙️", t4: "🌏" };
  $("topics").innerHTML = TOPICS.map(k => `<button class="topic ${topic === k ? "on" : ""}" data-k="${k}"><span class="ic">${items[k]}</span><b>${tp(k)}</b></button>`).join("");
  $("topics").querySelectorAll(".topic").forEach(b => b.onclick = () => { topic = topic === b.dataset.k ? null : b.dataset.k; renderLearn(); if (topic) $("detail").scrollIntoView({ behavior: "smooth", block: "start" }); });
  renderDetail();
}
function quiz(k, q, hint, ans) {
  const o = opened[k] || {};
  return `<div class="quiz"><div class="q">Q. ${q}</div><div class="btns"><button class="btn btn-sub btn-small" data-qk="${k}" data-w="h">${tp("hint")}</button><button class="btn btn-sub btn-small" data-qk="${k}" data-w="a">${tp("answer")}</button></div>${o.h ? `<div class="hint">${hint}</div>` : ""}${o.a ? `<div class="ans">${ans}</div>` : ""}</div>`;
}
function renderDetail() {
  const el = $("detail"); if (!topic) { el.hidden = true; return; } el.hidden = false;
  const s = lastGame; const n = myTx.filter(x => x.game === s.id).length;
  const head = h => `<div class="detail-hd"><button class="ib" id="dPrev" aria-label="prev">‹</button><h4>${h}</h4><button class="ib" id="dNext" aria-label="next">›</button><button class="ib" id="dClose" aria-label="close">×</button></div>`;
  let h = "";
  if (topic === "t1") {
    const list = myTx.filter(x => x.game === s.id);
    h = head(tp("t1_h")) + `<div class="small mono">${wallet.address}</div><div class="rows">${list.slice(0, 8).map(x => `<div class="row"><span class="ic">⚡</span><span class="sig mono">${x.ix} · ${x.sig}</span><span class="ok">${x.ms}ms</span></div>`).join("") || `<div class="row"><span></span><span class="muted">—</span><span></span></div>`}${n > 8 ? `<div class="small center">… +${n - 8}</div>` : ""}</div>` + quiz("t1", t("t1_q"), t("t1_hint"), t("t1_a"));
  } else if (topic === "t2") {
    h = head(tp("t2_h")) + `<div class="rows">${ledger.map(e => `<div class="row"><span class="ic">${{ recv: "⬇️", rent: "🗄️", entry: "🎟️", fee: "⚡", prize: "🏆" }[e.kind]}</span><span>${ledgerLabel(e)}</span><span class="${e.amount >= 0 ? "plus" : "minus"} num">${sol(e.amount, 6)}</span></div>`).join("")}<div class="pl-total"><span style="font-weight:700">${tp("w_now")}</span><b class="num">${solp(bal, 6)} SOL</b></div></div><button class="btn btn-sub btn-small" style="width:100%" id="dWallet">${tp("see_wallet")}</button>` + quiz("t2", t("t2_q"), t("t2_hint"), t("t2_a"));
  } else if (topic === "t3") {
    h = head(tp("t3_h")) + `<ul class="list">${raw("t3_" + s.id).map(x => `<li>${rich(x)}</li>`).join("")}</ul>` + quiz("t3", t("t3_q"), t("t3_hint"), t("t3_a"));
  } else {
    h = head(tp("t4_h")) + `<ul class="list">${raw("t4_list").map(x => `<li>${rich(x)}</li>`).join("")}</ul>` + quiz("t4", t("t4_q"), t("t4_hint"), t("t4_a"));
  }
  el.innerHTML = h;
  const i = TOPICS.indexOf(topic);
  $("dPrev").onclick = () => { topic = TOPICS[(i + 3) % 4]; renderLearn(); };
  $("dNext").onclick = () => { topic = TOPICS[(i + 1) % 4]; renderLearn(); };
  $("dClose").onclick = () => { topic = null; renderLearn(); };
  const dw = $("dWallet"); if (dw) dw.onclick = () => go("scrWallet");
  el.querySelectorAll("[data-qk]").forEach(b => b.onclick = () => { const k = b.dataset.qk; opened[k] = opened[k] || {}; opened[k][b.dataset.w] = true; renderDetail(); });
}
$("toWallet").onclick = () => go("scrWallet");
$("learnGloss").onclick = () => go("scrGloss");
$("learnPhantom").onclick = () => { pgI = 0; go("scrPhantom"); };
$("toPhantom").onclick = () => { pgI = 0; go("scrPhantom"); };
$("wGloss").onclick = () => openCat("money");
$("againBtn").onclick = () => { Object.keys(opened).forEach(k => delete opened[k]); topic = null; go("scrSelect"); };

// ================= AI アシスタント =================
let chatOpen = false, chatStarted = false, chatHinted = false;
function openChat() {
  chatOpen = true; $("chat").hidden = false; $("fab").classList.add("open"); $("fabLabel").hidden = true;
  if (!chatStarted) { chatStarted = true; botSay(tp("chat_hello")); }
}
function closeChat() { chatOpen = false; $("chat").hidden = true; $("fab").classList.remove("open"); }
$("fab").onclick = () => chatOpen ? closeChat() : openChat();
$("chatClose").onclick = closeChat;
$("chatMin").onclick = closeChat;
function addMsg(html, who) { const d = document.createElement("div"); d.className = "msg " + who; d.innerHTML = html; $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight; return d; }
function botSay(text) { const d = addMsg("……", "a"); setTimeout(() => { d.innerHTML = rich(text); $("msgs").scrollTop = $("msgs").scrollHeight; }, 600); }
function askBot(q) {
  addMsg(esc(q), "u");
  const s = q.toLowerCase();
  const has = (...w) => w.some(x => s.includes(x));
  for (const k of TERM_KEYS) {
    const names = [TERMS.ja[k][0], TERMS.en[k][0]].map(x => x.toLowerCase());
    if (names.some(n => s.includes(n))) { const [ti, sh, bo] = TERMS[lang][k]; botSay(fill(raw("bot_term"), { term: ti, short: sh, body: bo })); return; }
  }
  if (has("用語", "glossary", "word")) { botSay(raw("bot_gloss")); setTimeout(() => { closeChat(); go("scrGloss"); }, 900); return; }
  if (has("お金", "残高", "増え", "減", "money", "balance")) botSay(fill(raw("bot_money"), { bal: solp(bal, 6) }));
  else if (has("危", "安全", "怖", "safe", "risk")) botSay(raw("bot_safe"));
  else if (has("次", "next", "phantom", "つなげ")) botSay(raw("bot_next"));
  else if (has("勝", "負", "ずる", "win", "cheat")) botSay(raw("bot_win"));
  else botSay(raw("bot_default"));
}
$("chips").onclick = e => { const b = e.target.closest("[data-chip]"); if (!b) return; const i = +b.dataset.chip; if (i === 4) { addMsg(esc(raw("chips")[4]), "u"); botSay(raw("bot_gloss")); setTimeout(() => { closeChat(); if (cur() === "scrGame") return; go("scrGloss"); }, 900); return; } askBot(raw("chips")[i]); };
$("chatForm").onsubmit = e => { e.preventDefault(); const v = $("chatIn").value.trim(); if (!v) return; $("chatIn").value = ""; askBot(v); };

applyLang();
render("scrHome");
})();
